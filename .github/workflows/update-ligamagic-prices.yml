name: Atualizar preços LigaMagic

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Ignorar a janela de manutenção"
        required: false
        default: false
        type: boolean
      batch_size:
        description: "Quantidade de cartas no lote"
        required: false
        default: 300
        type: number

permissions:
  contents: write

concurrency:
  group: ligamagic-price-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: [self-hosted, Windows, X64, magic-banlist]
    timeout-minutes: 65
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Garantir estado Git limpo
        shell: powershell
        run: |
          $rebaseMerge = git rev-parse --git-path rebase-merge
          $rebaseApply = git rev-parse --git-path rebase-apply
          if ((Test-Path -LiteralPath $rebaseMerge) -or (Test-Path -LiteralPath $rebaseApply)) {
            git rebase --abort
            if ($LASTEXITCODE -ne 0) { throw "Não foi possível abortar o rebase residual do runner." }
          }
          git checkout --detach $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw "Não foi possível restaurar o SHA $env:GITHUB_SHA no runner." }
          git reset --hard $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw "Não foi possível limpar o checkout do runner." }

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Consultar lote de preços
        shell: powershell
        env:
          LIGAMAGIC_REQUEST_DELAY_MS: "10000"
          LIGAMAGIC_REQUEST_DELAY_MAX_MS: "12000"
          LIGAMAGIC_MAX_RUN_MS: "3000000"
          LIGAMAGIC_BLOCK_COOLDOWN_MS: "21600000"
          LIGAMAGIC_MAINTENANCE_INTERVAL_MS: "43200000"
          LIGAMAGIC_MAINTENANCE_LIMIT: "100"
          BATCH_SIZE: ${{ inputs.batch_size || 300 }}
          FORCE_ARG: ${{ inputs.force && '--force' || '' }}
        run: |
          $collectorArgs = @("scripts/update-ligamagic-prices.mjs", "--limit=$env:BATCH_SIZE")
          if ($env:FORCE_ARG) { $collectorArgs += $env:FORCE_ARG }
          & node @collectorArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publicar dados atualizados
        shell: powershell
        run: |
          function Invoke-Git {
            param([Parameter(ValueFromRemainingArguments = $true)][string[]]$Arguments)
            & git @Arguments
            if ($LASTEXITCODE -ne 0) { throw "git $($Arguments -join ' ') falhou com código $LASTEXITCODE." }
          }

          $dataChanges = git status --porcelain -- data | Out-String
          if ([string]::IsNullOrWhiteSpace($dataChanges)) {
            Write-Output "Nenhuma alteração de dados para publicar."
            exit 0
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          Invoke-Git add data
          Invoke-Git commit -m "Atualiza cobertura LigaMagic [skip ci]"
          $dataCommit = (& git rev-parse HEAD | Select-Object -First 1).Trim()
          if ($LASTEXITCODE -ne 0 -or -not $dataCommit) { throw "Não foi possível identificar o commit de dados." }

          for ($attempt = 1; $attempt -le 3; $attempt++) {
            Invoke-Git fetch origin main
            Invoke-Git checkout --detach origin/main
            Invoke-Git restore --source=$dataCommit --staged --worktree -- data

            $pendingChanges = git status --porcelain -- data | Out-String
            if ([string]::IsNullOrWhiteSpace($pendingChanges)) {
              Write-Output "Os dados coletados já estão publicados no main."
              exit 0
            }

            Invoke-Git commit -m "Atualiza cobertura LigaMagic [skip ci]"
            & git push origin HEAD:main
            if ($LASTEXITCODE -eq 0) {
              Write-Output "Dados publicados no main com sucesso."
              exit 0
            }

            if ($attempt -lt 3) {
              Write-Warning "O main avançou durante a publicação; repetindo sobre o SHA mais recente ($attempt/3)."
            }
          }

          throw "Não foi possível publicar os dados no main após três tentativas."
