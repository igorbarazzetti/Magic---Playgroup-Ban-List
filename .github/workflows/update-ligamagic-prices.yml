name: Atualizar preços LigaMagic

on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Ignorar a janela de manutenção"
        required: false
        default: false
        type: boolean
      batch_size:
        description: "Quantidade de cartas no lote"
        required: false
        default: 100
        type: number

permissions:
  contents: write

concurrency:
  group: ligamagic-price-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: [self-hosted, Windows, X64, magic-banlist]
    timeout-minutes: 45
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Consultar lote de preços
        shell: pwsh
        env:
          LIGAMAGIC_REQUEST_DELAY_MS: "10000"
          BATCH_SIZE: ${{ inputs.batch_size || 100 }}
          FORCE_ARG: ${{ inputs.force && '--force' || '' }}
        run: |
          $collectorArgs = @("scripts/update-ligamagic-prices.mjs", "--limit=$env:BATCH_SIZE")
          if ($env:FORCE_ARG) { $collectorArgs += $env:FORCE_ARG }
          & node @collectorArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publicar dados atualizados
        shell: pwsh
        run: |
          $dataChanges = git status --porcelain -- data | Out-String
          if ([string]::IsNullOrWhiteSpace($dataChanges)) {
            Write-Output "Nenhuma alteração de dados para publicar."
            exit 0
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "Atualiza cobertura LigaMagic [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
